schema: meridian.benchmark_scenario/v3
id: newer_college_quad_easy
role: development
license: CC-BY-NC-SA-4.0
input:
  format: rosbag2_sqlite3
  path: bags/newer-college/quad-easy
  duration_s: 198.998
  required_runtime_checksum: true
sensors:
  imu:
    topic: /alphasense_driver_ros/imu
    frame: imu_sensor_frame
    nominal_rate_hz: 200.0
  lidar:
    topic: /os_cloud_node/points
    frame: os_sensor
    nominal_rate_hz: 10.0
    header_convention: scan_start
    point_time_field: {name: t, unit: ns, relative_to: header}
  cameras:
    topics:
      - /alphasense_driver_ros/cam0/compressed
      - /alphasense_driver_ros/cam1/compressed
      - /alphasense_driver_ros/cam3/compressed
      - /alphasense_driver_ros/cam4/compressed
    nominal_rate_hz: 30.0
calibration:
  camera_collection: bags/newer-college/calib/collection1
  body_lidar: bags/newer-college/calib/os_imu_lidar_transforms.yaml
  beam_intrinsics: bags/newer-college/calib/beam_intrinsics_os0-128.json
ground_truth:
  path: bags/newer-college/gt/tum/gt-nc-quad-easy.csv
  body_frame: base_link
  poses: 1988
  path_length_m: 246.666
estimate:
  artifact: trajectory_base.tum
  body_frame: base_link
evaluation_profiles:
  internal_interpolated:
    purpose: meridian_development_and_acceptance
    publication_eligible: false
    association: interpolate
    coverage_protocol: meridian.fixed_cold_start/v1
    startup_allowance_s: 2.2
    maximum_startup_delay_s: 2.2
    maximum_end_loss_s: 0.20
    max_interpolation_gap_s: 0.20
    alignment: se3_no_scale
    no_estimate_dependent_trimming: true
    no_extrapolation: true
    rpe_distance_m: 10.0
    minimum_window_coverage: 0.99
    max_output_gap_s: 0.50
    max_linear_speed_mps: 30.0
    max_angular_speed_degps: 720.0
  published_nearest_10ms:
    purpose: published_newer_college_comparison
    publication_eligible: true
    association: nearest
    coverage_protocol: meridian.full_reference/v1
    max_dt_s: 0.01
    unique_one_to_one: true
    alignment: se3_no_scale
    no_trimming: true
    no_extrapolation: true
    rpe_distance_m: 10.0
    minimum_coverage: 0.99
    max_output_gap_s: 0.50
    max_linear_speed_mps: 30.0
    max_angular_speed_degps: 720.0
acceptance_gates:
  evaluation_profile: internal_interpolated
  ate_rmse_m:
    first_end_to_end: 0.15
    competitive: 0.07
    strict_sota_class: 0.05
published_results_context:
  evaluation_profile: published_nearest_10ms
  comparison_only_not_acceptance_gate: true
  reference_method: GLIM_with_loop_closure
  reported_ate_rmse_m: 0.070
  source: arXiv:2407.10344_Table_V
  note: Use only after independently reproducing the paper's nearest-10-ms protocol.
known_limits:
  - no_gnss
  - publisher_qos_not_preserved_by_dataset_conversion
