# Player-side QoS override for bag replay (passed by tools/run_bag_headless.sh).
#
# Best-effort delivery of the fragmented multi-MB LiDAR messages silently loses a
# double-digit fraction in flight when the host runs the full pipeline (no
# retransmission at best effort; measured 2671 published -> ~2290 received). A
# reliable WRITER here + the node's reliable subscription (sensors.lidar.qos_reliable
# in the replay config) restores retransmission and delivers every scan. depth 50
# gives the writer's flush thread 5 s of slack at 10 Hz before backpressure.
/os_cloud_node/points:
  reliability: reliable
  history: keep_last
  depth: 50
