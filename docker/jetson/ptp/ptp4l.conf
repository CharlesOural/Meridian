# Free-running PTP grandmaster on end0. The interval/transport settings match the
# 3rd-party-grandmaster profile the Ouster requires: UDP/IPv4, E2E, two-step,
# announce interval 1, sync interval 0, delay-request interval 0.
[global]
network_transport       UDPv4
delay_mechanism         E2E
time_stamping           hardware
twoStepFlag             1
logAnnounceInterval     1
logSyncInterval         0
logMinDelayReqInterval  0
# Win BMCA so the Jetson is the grandmaster. clockClass 248 = free-running
# (no GPS / not time-traceable) — honest for a no-GNSS rig.
priority1               127
clockClass              248
summary_interval        4

[end0]
